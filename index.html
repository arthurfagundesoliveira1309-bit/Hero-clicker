  let petBonus=1 + (enchantLevels.void||0)*0.20;
  return {coinBonus,cursorBonus,petBonus};

function spinEnchant(){
  const QUAD=1000000000000000;
  if(!spinFree && coins < QUAD){ return alert('Precisa 1 QUAD (1.000.000.000.000.000) pra girar!'); }
  if(!spinFree) coins-=QUAD; spinFree=false;
  $('enchantModal').classList.add('show');
  $('roulette').classList.remove('stop');
  $('enchantResult').innerText='Girando...';
  setTimeout(()=>{
    let roll=Math.random()*100, acc=0, chosen=null;
    let shuffled=[...ENCHANTS].sort(()=>Math.random()-0.5);
    for(let e of ENCHANTS){ acc+=e.chance; if(roll<=acc){ chosen=e; break; } }
    if(!chosen) chosen=ENCHANTS[0];
    if((enchantLevels[chosen.id]||0)>=chosen.max){ // se max, tenta outro
      chosen=ENCHANTS.find(en=>(enchantLevels[en.id]||0)<en.max) || chosen;
    }
    enchantLevels[chosen.id]=(enchantLevels[chosen.id]||0)+1;
    if(enchantLevels[chosen.id]>chosen.max) enchantLevels[chosen.id]=chosen.max;
    localStorage.setItem('HERO_ENCH', JSON.stringify(enchantLevels));
    $('roulette').classList.add('stop');
    $('roulette').innerText=chosen.emoji;
    $('enchantResult').innerHTML=`<span style="color:${chosen.rarity=='mythic'?'gold':chosen.rarity=='legendary'?'#a855f7':chosen.rarity=='rare'?'#00aaff':'#fff'}">${chosen.rarity.toUpperCase()}</span><br>${chosen.emoji} ${chosen.name} Lv${enchantLevels[chosen.id]}<br><small>${chosen.desc}</small>`;
    buySound(); render(); save();
  },1200);
}

function getTotalMult(){
  let base=(AURAS.find(a=>a.id==aura)?.mult||1)*(pets.find(p=>p.id==equippedPet)?.mult||1);
  if(activeBoost) base*=activeBoost.mult; base*=adminMult; if(isHalloweenActive) base*=2;
  let ench=getEnchantBonus(); base*=ench.coinBonus; base*=ench.petBonus; base*=getSkinBonus();
  if(enchantLevels.midas>0 && Math.random() < 0.10*enchantLevels.midas){ base*=2; }
  return base;
}

function openTab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.nbtn').forEach(e=>e.classList.remove('active'));let el=$('tab'+t.charAt(0).toUpperCase()+t.slice(1)); if(el) el.classList.add('active'); let btn=$('tabBtn'+t.charAt(0).toUpperCase()+t.slice(1)); if(btn) btn.classList.add('active');}
function buySkin(id){ let s=SKINS_BTN.find(x=>x.id==id); if(ownedSkins.includes(id)){equippedBtnSkin=id;buySound();render();return;} if(coins < s.price){alert('Sem grana');return;} coins-=s.price; ownedSkins.push(id); equippedBtnSkin=id; buySound(); render(); }
function buyAura(id){ let a=AURAS.find(x=>x.id==id); if(a.isCyber &&!ownedAuras.includes(id) && cyberPoints < a.cyberPrice){alert('Precisa '+a.cyberPrice+' 🔵'); return;} if(a.isSupernova &&!ownedAuras.includes(id) && coins < 1000000000000){alert('Precisa 1T'); return;} if(a.isHalloween &&!ownedAuras.includes(id) && coins < 5000000000000000){alert('Precisa 5Q'); return;} if(ownedAuras.includes(id)){aura=id;buySound();render();return;} if(a.isCyber){ cyberPoints-=a.cyberPrice; ownedAuras.push(id); aura=id; buySound(); render(); return; } if(a.isSupernova){ coins-=1000000000000; ownedAuras.push(id); aura=id; buySound(); render(); return; } if(a.isHalloween){ coins-=5000000000000000; ownedAuras.push(id); aura=id; buySound(); render(); return; } if(coins<a.price){alert('Sem grana!');return;}coins-=a.price;ownedAuras.push(id);aura=id;buySound();render(); }
function buyCyberAura(){ if(ownedAuras.includes('cyber')){ aura='cyber'; buySound(); render(); return; } if(cyberPoints<170){ alert('Precisa 170 🔵'); return; } cyberPoints-=170; ownedAuras.push('cyber'); aura='cyber'; buySound(); render(); }
function buyCursor(lv){ if(lv!=cursorLevel+1){alert('Compra em ordem!');return;} let c=CURSORS.find(x=>x.level==lv); if(coins<c.price){alert('Precisa '+c.price.toLocaleString());return;} coins-=c.price; cursorLevel=lv; buySound(); render(); }
function buyEgg(type){ let egg=EGGS.find(e=>e.id==type);if(coins<egg.price){alert('Precisa '+egg.price.toLocaleString());return;} coins-=egg.price;let pool=PETS_POOL.filter(p=>egg.pool.includes(p.rarity));let chosen=pool[Math.floor(Math.random()*pool.length)]; if(type=='basic'){let r=Math.random();if(r<0.4) chosen=PETS_POOL[0];else if(r<0.75) chosen=PETS_POOL[1];else if(r<0.90) chosen=PETS_POOL[2];else chosen=PETS_POOL[3];} if(type=='epic'&&Math.random()<0.10) chosen=PETS_POOL.find(p=>p.rarity=='legendary'); if(type=='mythic'&&Math.random()<0.08) chosen=PETS_POOL.find(p=>p.rarity=='mythic'); let newPet={id:'pet_'+Date.now()+Math.random(),name:chosen.name,rarity:chosen.rarity,emoji:chosen.emoji,base:chosen.base,mult:chosen.base,level:1,feedCount:0,sellValue:chosen.value}; pets.push(newPet);if(!equippedPet) equippedPet=newPet.id;render();startHatchAnimation(newPet,type); }
function buySupernovaEgg(){ if(!supernovaActive){alert('Evento Supernova não ativo!');return;} if(coins<300000000000){alert('Precisa 300B!');return;} coins-=300000000000; let r=Math.random()*100; let chosen; if(r<90) chosen=SUPERNOVA_PETS[0]; else if(r<99.9) chosen=SUPERNOVA_PETS[1]; else chosen=SUPERNOVA_PETS[2]; let newPet={id:'pet_'+Date.now()+Math.random(),name:chosen.name,rarity:chosen.rarity,emoji:chosen.emoji,base:chosen.base,mult:chosen.base,level:1,feedCount:0,sellValue:chosen.value,isSupernova:true}; pets.push(newPet); if(!equippedPet) equippedPet=newPet.id; render(); startHatchAnimation(newPet,'supernova');}
function buyCyberEgg(){ if(cyberPoints<50){alert('Precisa 50 🔵');return;} cyberPoints-=50; let r=Math.random()*100; let chosen; if(r<50) chosen=CYBER_PETS[0]; else if(r<95) chosen=CYBER_PETS[1]; else chosen=CYBER_PETS[2]; let newPet={id:'pet_'+Date.now()+Math.random(),name:chosen.name,rarity:chosen.rarity,emoji:chosen.emoji,base:chosen.base,mult:chosen.base,level:1,feedCount:0,sellValue:chosen.value,isCyber:true}; pets.push(newPet);if(!equippedPet) equippedPet=newPet.id;render();startHatchAnimation(newPet,'cyber'); }
function buyHalloweenEgg(){ if(!isHalloweenActive){alert('Halloween não ativo!');return;} if(coins<4000000000000000){alert('Precisa 4Q!');return;} coins-=4000000000000000; let r=Math.random()*100; let chosen; if(r<70) chosen=HALLOWEEN_PETS[0]; else if(r<99) chosen=HALLOWEEN_PETS[1]; else chosen=HALLOWEEN_PETS[2]; let newPet={id:'pet_'+Date.now()+Math.random(),name:chosen.name,rarity:chosen.rarity,emoji:chosen.emoji,base:chosen.base,mult:chosen.base,level:1,feedCount:0,sellValue:chosen.value,isHalloween:true}; pets.push(newPet); if(!equippedPet) equippedPet=newPet.id; render(); startHatchAnimation(newPet,'halloween'); }
function startHatchAnimation(pet,eggType){ let modal=$('hatchModal'),eggEl=$('eggDisplay'),petEl=$('petReveal'),txt=$('hatchText'),rar=$('hatchRarity'),btnCont=$('btnContinue'),btnColl=$('btnCollect'); modal.classList.add('show');eggEl.style.display='block';eggEl.className='eggAnim shaking';eggEl.innerText=eggType=='basic'?'🥚':eggType=='epic'?'💜':eggType=='mythic'?'🌟':eggType=='cyber'?'🔵':eggType=='supernova'?'☀️':eggType=='halloween'?'🕸️':eggType=='fusion'?'🍀':eggType=='ultra'?'💫':'🥚'; petEl.classList.remove('show');petEl.style.display='none';txt.innerText='Chocando...';rar.innerHTML='';btnCont.style.display='none';btnColl.style.display='none';initA(); setTimeout(()=>{eggEl.classList.remove('shaking');eggEl.classList.add('cracking');crackSound();btnCont.style.display='block';txt.innerText='Rachou!';},1300); setTimeout(()=>{eggEl.style.display='none';petEl.innerText=pet.emoji;petEl.style.display='block';setTimeout(()=>petEl.classList.add('show'),50);txt.innerHTML=`${pet.emoji} <b>${pet.name}</b>!`;rar.innerHTML=`<span class="rarity ${pet.rarity}">${pet.rarity.toUpperCase()}</span>`;btnCont.style.display='none';btnColl.style.display='block';},2100); }
function closeHatch(){$('hatchModal').classList.remove('show');}
function equipPet(id){equippedPet=id;buySound();render();}
function sellPet(id){ let pet=pets.find(p=>p.id==id); if(!pet) return; if(pets.length==1 && equippedPet==id){alert('Não pode vender único');return;} if(!confirm(`Vender ${pet.emoji} ${pet.name}?`)) return; coins+=Math.floor(pet.sellValue*pet.mult); pets=pets.filter(p=>p.id!=id); if(equippedPet==id) equippedPet=pets[0]?.id||null; buySound(); render(); }
function buyHelper(id){ if(activeBoost){alert('Já tem boost ativo!');return;} let now=Date.now()/1000; let cdLeft=Math.max(0, Math.floor((cooldowns[id]||0)-now)); if(cdLeft>0){alert(`Cooldown: ${cdLeft}s`);return;} let h=HELPERS.find(x=>x.id==id); if(coins<h.price){alert('Sem grana!');return;} coins-=h.price; activeBoost=h; boostTimer=h.time; cooldowns[id]=now + h.cd; buySound(); render(); clearInterval(boostInterval); boostInterval=setInterval(()=>{ boostTimer--; if(boostTimer<=0){ clearInterval(boostInterval); activeBoost=null; render(); } },1000); }
function resetSave(){ if(confirm('Zerar tudo?')){ localStorage.clear(); location.reload(); } }
function checkGlobalRanking(){ if(!window.firebaseReady) return; let top3 = window.globalTop3||[]; let minTop = top3.length < 3? 0 : Math.min(...top3.map(r=>r.coins||0)); if(coins > minTop && coins > bestGlobalSaved && coins > 500){ if(playerNameLocal && playerNameLocal.length >= 2){ saveGlobalRanking(true); } else { $('nameModal').classList.add('show'); $('playerName').value = playerNameLocal||''; } } }
async function saveGlobalRanking(isAuto=false){ let name = isAuto? playerNameLocal : ($('playerName').value.trim() || 'Jogador'); if(name.length<2) name='Jogador'; playerNameLocal=name; localStorage.setItem('HERO_NAME',name); bestGlobalSaved=coins; localStorage.setItem('HERO_BEST_GLOBAL',bestGlobalSaved); let data={name, coins:coins, clicks:totalClicks, mult:getTotalMult(), pets:pets.length, timestamp:Date.now()}; if(window.firebaseReady){ try{ await window.firebaseOps.push(window.rankingRef,data); if(!isAuto){ $('nameModal').classList.remove('show'); } }catch(e){} } else if(!isAuto){ $('nameModal').classList.remove('show'); } save(); render(); }
function toggleFusionSel(idx){ if(fusionSelected.includes(idx)) fusionSelected=fusionSelected.filter(i=>i!=idx); else { if(fusionSelected.length>=3) return alert('Máximo 3'); fusionSelected.push(idx); } render(); }
function doFusion(){ let baseCd=300000*(1 - (enchantLevels.tempo||0)*0.1); let cd=baseCd-(Date.now()-lastFusion); if(cd>0) return alert('Cooldown! '+Math.ceil(cd/1000)+'s'); if(fusionSelected.length!=3) return alert('Selecione 3!'); let r=pets[fusionSelected[0]].rarity; if(!fusionSelected.every(i=>pets[i].rarity==r)) return alert('Mesma raridade!'); let sorted=[...fusionSelected].sort((a,b)=>b-a); sorted.forEach(i=>pets.splice(i,1)); if(equippedPet &&!pets.find(p=>p.id==equippedPet)) equippedPet=pets[0]?.id||null; fusionSelected=[]; lastFusion=Date.now(); localStorage.setItem('HERO_FUSIONS', (parseInt(localStorage.getItem('HERO_FUSIONS')||'0')+1).toString()); let table=FUSION_TABLE[r]; if(!table) return alert('Sem fusão'); let roll=Math.random()*100, acc=0, chosen=table[0]; for(let it of table){ acc+=it.chance; if(roll<=acc){ chosen=it; break; } } if(enchantLevels.fusao>0 && Math.random()<0.05*enchantLevels.fusao){ let nextRarity={common:'rare',rare:'epic',epic:'legendary',legendary:'mythic',mythic:'mythic'}[r]; if(FUSION_TABLE[nextRarity]){ let nt=FUSION_TABLE[nextRarity]; chosen=nt[Math.floor(Math.random()*nt.length)]; } } let egg={id:Date.now(),rarity:r,pet:chosen,start:Date.now(),end:Date.now()+120000}; fusionEggs.push(egg); buySound(); render(); }
function hatchFusion(id){ let egg=fusionEggs.find(e=>e.id==id); if(!egg) return; if(Date.now()<egg.end) return alert('Ainda rachando!'); let p=egg.pet; let newPet={id:'pet_'+Date.now()+Math.random(),name:p.name,rarity:p.rarity,emoji:p.emoji,base:p.base,mult:p.base,level:1,feedCount:0,sellValue:p.value,isFusion:true}; pets.push(newPet); if(!equippedPet) equippedPet=newPet.id; fusionEggs=fusionEggs.filter(e=>e.id!=id); render(); startHatchAnimation(newPet,'fusion'); }
function craftUltra(id){ let rec=ULTRA_RECIPES.find(x=>x.id==id); let missing=rec.need.filter(need=>!pets.some(p=>p.name.includes(need)||p.name==need)); if(missing.length>0) return alert('Falta: '+missing.join(', ')); rec.need.forEach(need=>{ let idx=pets.findIndex(p=>p.name.includes(need)||p.name==need); if(idx>=0) pets.splice(idx,1); }); if(equippedPet &&!pets.find(p=>p.id==equippedPet)) equippedPet=pets[0]?.id||null; let newPet={id:'pet_'+Date.now()+Math.random(),name:rec.name,rarity:'ultrapet',emoji:rec.emoji,base:rec.base,mult:rec.base,level:1,feedCount:0,sellValue:500000,isUltra:true}; pets.push(newPet); equippedPet=newPet.id; buySound(); render(); startHatchAnimation(newPet,'ultra'); }
$('clickBtn').addEventListener('click',()=>{initA();pop();startMusicOnFirstClick(); totalClicks++;coins+=getTotalMult(); if(isCyberEvent){ eventProgress++; if(eventProgress>=100){ eventProgress=0; cyberPoints++; buySound(); } } $('clickBtn').style.transform='scale(0.92)';setTimeout(()=>$('clickBtn').style.transform='scale(1)',80);render();if(totalClicks%50==0) checkGlobalRanking();});
setInterval(()=>{ let cps=getCursorCPS(); if(cps>0){ let gain=cps*getTotalMult(); coins+=gain; totalClicks+=cps; if(isCyberEvent){ eventProgress+=cps; while(eventProgress>=100){ eventProgress-=100; cyberPoints++; } } render(); } },1000);
setInterval(()=>{save();},2000); render(); setInterval(()=>{ render(); },1000);
</script>
