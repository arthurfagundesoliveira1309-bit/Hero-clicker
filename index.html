flex;flex-direction:column;gap:4px"><button onclick="equipPet('${p.id}')" style="padding:5px 8px;border-radius:8px;background:${equippedPet==p.id?'#00ff88':'#333'};color:${equippedPet==p.id?'#000':'#fff'};border:none;font-size:10px">${equippedPet==p.id?'EQUIPADO':'EQUIPAR'}</button><button onclick="feedPet('${p.id}')" style="padding:5px 8px;border-radius:8px;background:#ffaa00;color:#000;border:none;font-size:10px;font-weight:bold">🍖 ALIMENTAR ${foodAmount.toFixed(1)}</button></div></div>`; }); $('tabPets').innerHTML=htmlP;

function buyAura(id){let a=AURAS.find(x=>x.id==id);if(a.isCyber &&!ownedAuras.includes(id) && cyberPoints < a.cyberPrice){alert('Precisa '+a.cyberPrice+' 🔵'); return;} if(a.isSupernova &&!ownedAuras.includes(id) && coins < 1000000000000){alert('Precisa 1 TRILHÃO!'); return;} if(ownedAuras.includes(id)){aura=id;buySound();render();return;} if(a.isCyber){ cyberPoints-=a.cyberPrice; ownedAuras.push(id); aura=id; buySound(); render(); return; } if(a.isSupernova){ coins-=1000000000000; ownedAuras.push(id); aura=id; buySound(); render(); return; } if(coins<a.price){alert('Sem grana!');return;}coins-=a.price;ownedAuras.push(id);aura=id;buySound();render();}

function buyEgg(type){ let egg=EGGS.find(e=>e.id==type);if(coins<egg.price){alert('Precisa '+egg.price.toLocaleString());return;} coins-=egg.price;let pool=PETS_POOL.filter(p=>egg.pool.includes(p.rarity));let chosen=pool[Math.floor(Math.random()*pool.length)]; if(type=='basic'){let r=Math.random();if(r<0.4) chosen=PETS_POOL[0];else if(r<0.75) chosen=PETS_POOL[1];else if(r<0.90) chosen=PETS_POOL[2];else chosen=PETS_POOL[3];} if(type=='epic'&&Math.random()<0.10) chosen=PETS_POOL.find(p=>p.rarity=='legendary'); if(type=='mythic'&&Math.random()<0.08) chosen=PETS_POOL.find(p=>p.rarity=='mythic'); let newPet={id:'pet_'+Date.now()+Math.random(),name:chosen.name,rarity:chosen.rarity,emoji:chosen.emoji,base:chosen.base,mult:chosen.base,level:1,sellValue:chosen.value}; pets.push(newPet);if(!equippedPet) equippedPet=newPet.id;render();startHatchAnimation(newPet,type); }

function buyHelper(id){ if(activeBoost){alert('Já tem boost ativo!');return;} let now=Date.now()/1000; let cdLeft=Math.max(0, Math.floor((cooldowns[id]||0)-now)); if(cdLeft>0){alert(`Cooldown: ${cdLeft}s`);return;} let h=HELPERS.find(x=>x.id==id); if(coins<h.price){alert('Sem grana!');return;} coins-=h.price; activeBoost=h; boostTimer=h.time; cooldowns[id]=now + h.cd; buySound(); render(); clearInterval(boostInterval); boostInterval=setInterval(()=>{ boostTimer--; if(boostTimer<=0){ clearInterval(boostInterval); activeBoost=null; render(); } else { let bb=$('boostBanner'); if(bb) bb.innerHTML=`<div class="boostActive">⚡ ${activeBoost.name.toUpperCase()} x${activeBoost.mult} - ${boostTimer}s</div>`; } },1000); }

function checkGlobalRanking(){ if(!window.firebaseReady) return; let top3 = window.globalTop3||[]; let minTop = top3.length < 3? 0 : Math.min(...top3.map(r=>r.coins||0)); if(coins > minTop && coins > bestGlobalSaved && coins > 500){ if(playerNameLocal && playerNameLocal.length >= 2){ saveGlobalRanking(true); } else { $('nameModal').classList.add('show'); $('playerName').value = playerNameLocal||''; } } }

$('clickBtn').addEventListener('click',()=>{initA();pop();startMusicOnFirstClick(); totalClicks++;coins+=getTotalMult(); if(isCyberEvent){ eventProgress++; if(eventProgress>=100){ eventProgress=0; cyberPoints++; buySound(); } } $('clickBtn').style.transform='scale(0.92)';setTimeout(()=>$('clickBtn').style.transform='scale(1)',80);render();if(totalClicks%50==0) checkGlobalRanking();});
