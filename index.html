<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERO V17 - SUPERNOVA</title>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080f;color:#fff;font-family:Arial;text-align:center}
.top{padding:10px;background:#111;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.coin{font-weight:900;color:#ffde59}.cyber{font-weight:900;color:#a855f7}
.clickWrap{position:relative;width:220px;height:220px;margin:15px auto;display:flex;align-items:center;justify-content:center}
.aura{position:absolute;inset:-15px;border-radius:50%;pointer-events:none}
.aura.cinza{border:3px solid #888;box-shadow:0 0 20px #888}.aura.azul{border:3px solid #00aaff;box-shadow:0 0 35px #00aaff;animation:spin 3s linear infinite}
.aura.fogo{border:4px solid #ff4400;box-shadow:0 0 40px #ff4400;animation:pulse 0.8s infinite}.aura.gelo{border:4px solid #00ffff;box-shadow:0 0 40px #00ffff;animation:spin 2s linear infinite reverse}
.aura.void{border:4px solid #a000ff;background:conic-gradient(from 0deg,#a000ff,transparent,#a000ff,transparent);box-shadow:0 0 50px #a000ff;animation:spin 1.2s linear infinite}
.aura.estelar{border:5px solid gold;background:conic-gradient(from 0deg,gold,#fff,gold);box-shadow:0 0 50px gold;animation:spin 0.9s linear infinite}
.aura.cosmica{border:5px solid #ff00ff;background:conic-gradient(from 0deg,#ff00ff,#00ffff,#ffff00,#ff00ff);box-shadow:0 0 60px #ff00ff;animation:spin 0.6s linear infinite}
.aura.cyber{border:5px solid #6d28d9;background:conic-gradient(from 0deg,#1e1b4b,#7c3aed,#06b6d4,#1e1b4b);box-shadow:0 0 60px #7c3aed,0 0 100px #06b6d4;animation:spin 0.5s linear infinite}
.aura.supernova{border:5px solid #ffaa00;background:conic-gradient(from 0deg,#ffff00,#ff6600,#000000,#ffff00);box-shadow:0 0 60px #ffff00,0 0 100px #ff6600;animation:spin 0.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.clickBtn{width:200px;height:200px;border-radius:50%;background:linear-gradient(#00ff88,#00cc66);border:none;font-weight:900;font-size:28px;color:#000;z-index:2}
.rankBox{background:#15151f;border:1px solid #333;border-radius:12px;padding:10px;margin:10px;font-size:12px;text-align:left}
.rank1{color:gold;font-weight:900}.rank2{color:#ccc;font-weight:900}.rank3{color:#cd7f32;font-weight:900}
#shop{position:fixed;top:0;right:0;width:100%;max-width:380px;height:100%;background:#0f0f19;z-index:100;padding:16px;text-align:left;overflow:auto;transform:translateX(100%);transition:.3s}
#shop.open{transform:translateX(0)}.tab{display:none}.tab.active{display:block}
.item{background:#1a1a28;padding:12px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2a40}
.pet{padding:10px;border-radius:12px;margin-bottom:8px;background:#151525;border:1px solid #333;display:flex;justify-content:space-between;align-items:center}
.petEmoji{font-size:22px;animation:petFloat 2s ease-in-out infinite;display:inline-block}@keyframes petFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rarity{font-size:9px;padding:2px 6px;border-radius:6px;font-weight:bold}.common{background:#555}.rare{background:#0077ff}.epic{background:#a000ff}.legendary{background:gold;color:#000}.mythic{background:linear-gradient(45deg,#ff00ff,#00ffff);color:#000}.cyberRarity{background:linear-gradient(45deg,#4c1d95,#06b6d4);color:#fff}.supernovaRarity{background:linear-gradient(45deg,#ffff00,#ff6600);color:#000}
.nbtn{padding:7px 9px;border-radius:20px;border:1px solid #333;background:#1a1a28;color:#fff;font-weight:bold;font-size:9px;margin:2px}.nbtn.active{background:#00ff88;color:#000}
#hatchModal,#nameModal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#hatchModal.show,#nameModal.show{display:flex}.eggAnim{font-size:90px}.shaking{animation:eggShake 0.12s infinite}.cracking{animation:eggCrack 0.6s forwards}
@keyframes eggShake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@keyframes eggCrack{0%{transform:scale(1)}100%{transform:scale(0);opacity:0}}
.petReveal{font-size:80px;display:none}.petReveal.show{display:block;animation:revealPop 0.6s forwards}@keyframes revealPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.boostActive{background:#00ff88;color:#000;padding:8px;border-radius:10px;text-align:center;margin-bottom:10px;font-weight:900;animation:pulse 0.8s infinite}
.cyberBanner{background:linear-gradient(90deg,#4c1d95,#7c3aed,#06b6d4);padding:10px;border-radius:12px;margin:10px;font-weight:900;animation:pulse 0.8s infinite}
.supernovaBanner{background:linear-gradient(90deg,#ffff00,#ff6600,#000);padding:10px;border-radius:12px;margin:10px;font-weight:900;animation:pulse 0.6s infinite;color:#fff}
#adminEventBar{position:fixed;top:0;left:0;width:100%;background:linear-gradient(90deg,#a000ff,#ff00ff);color:#fff;padding:6px;text-align:center;font-weight:900;font-size:12px;display:none;z-index:4000}
#adminAnnounce{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:linear-gradient(45deg,gold,#ffaa00);color:#000;padding:14px 22px;border-radius:20px;font-weight:900;z-index:6000;display:none;max-width:92%;box-shadow:0 0 30px gold}
.foodBar{background:#1a1a28;border:1px solid #ffaa00;padding:10px;border-radius:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.foodCtrl{display:flex;align-items:center;gap:6px}.ctrlBtn{width:32px;height:32px;border-radius:8px;border:none;background:#333;color:#fff;font-weight:900;font-size:16px}
.confetti{position:fixed;top:-50px;font-size:30px;animation:fall linear forwards;pointer-events:none;z-index:9999}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hidden{display:none!important}
/* BALADA RAYA */
#efeitoRaya{position:fixed;inset:0;pointer-events:none;z-index:9998;display:none}
#efeitoRaya.ativo{display:block;animation:piscaBalada 0.45s infinite}
@keyframes piscaBalada{0%{background:rgba(0,0,0,0.75)}50%{background:rgba(255,255,255,0.18)}100%{background:rgba(0,0,0,0.75)}}
</style>
</head>
<body>
<audio id="musicaLobby" loop preload="auto" src="metamorfose.mp3"></audio>
<audio id="musicaRaya" loop preload="auto" src="raya.mp3"></audio>
<div id="efeitoRaya"></div>
